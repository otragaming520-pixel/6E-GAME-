<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REAL PANEL ACTIVE - KING AI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
    --gold-main: #ffe600;
    --neon-green: #39ff14;
    --hot-pink: #ff007f;
    --panel-bg: radial-gradient(circle at center, #241135 0%, #0d0515 100%);
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Orbitron', sans-serif; user-select: none; }
body { background:#000; overflow:hidden; width: 100vw; height: 100vh; }

#bg-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }

/* MINI FLOATING BUTTON */
#mini {
    position: fixed; right: 20px; bottom: 100px; width: 60px; height: 60px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; background: radial-gradient(circle,#2a3300,#0a0f00);
    border: 2px solid var(--gold-main); box-shadow: 0 0 15px var(--gold-main);
}
#mini img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

/* MAIN PANEL WRAPPER */
#panel-wrapper {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 250px; display: none; justify-content: center; align-items: center;
    z-index: 10000;
}

/* BUTTERFLY WINGS CONTAINER */
.wings-bg {
    position: absolute; width: 440px; height: 260px;
    pointer-events: none; z-index: 1; display: flex; justify-content: space-between;
}

.wing {
    width: 130px; height: 100%;
    filter: drop-shadow(0 0 12px rgba(255, 230, 0, 0.9)) drop-shadow(0 0 25px rgba(255, 120, 0, 0.7));
    animation: wingPulse 2.5s ease-in-out infinite alternate;
}

.wing-left { transform-origin: right center; }
.wing-right { transform-origin: left center; }

@keyframes wingPulse {
    0% { transform: scale(0.98) rotate(0deg); }
    100% { transform: scale(1.04) rotate(2deg); }
}

/* MAIN PANEL UI */
#main {
    position: relative; z-index: 2; width: 240px;
    background: var(--panel-bg);
    border: 2px solid #b44fff; border-radius: 20px;
    box-shadow: 0 0 20px rgba(180, 79, 255, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.2);
    padding: 12px; text-align: center; overflow: hidden;
}

.header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; border-bottom: 1px dashed rgba(255, 0, 127, 0.4);
    cursor: move;
}

.header-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 900; color: #fff; text-shadow: 0 0 8px var(--gold-main);
}

.bolt-icon {
    width: 18px; height: 18px; background: #ffd700; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; color: #000;
    font-size: 11px; font-weight: bold; box-shadow: 0 0 8px #ffd700;
}

.close-btn {
    width: 18px; height: 18px; border-radius: 50%; border: 1px solid #ff4444;
    color: #ff4444; font-size: 10px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; font-weight: bold;
    background: rgba(255, 68, 68, 0.1);
}

.top-badges {
    display: flex; justify-content: space-between; align-items: center;
    margin: 8px 0; font-size: 9px; font-weight: bold;
}

.live-badge {
    background: rgba(0, 255, 128, 0.15); border: 1px solid #00ff80; color: #00ff80;
    padding: 2px 8px; border-radius: 12px; display: flex; align-items: center; gap: 4px;
}
.live-badge span { width: 5px; height: 5px; background: #00ff80; border-radius: 50%; box-shadow: 0 0 5px #00ff80; }

.id-badge {
    background: rgba(255, 230, 0, 0.15); border: 1px solid var(--gold-main); color: var(--gold-main);
    padding: 2px 8px; border-radius: 12px;
}

.status-title {
    font-size: 9px; color: var(--gold-main); letter-spacing: 1px;
    margin: 6px 0; font-weight: 700; text-shadow: 0 0 5px var(--gold-main);
}

.info-box {
    background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(180, 79, 255, 0.4);
    border-radius: 8px; padding: 6px 8px; margin-bottom: 6px;
    font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 700;
    color: #fff; text-align: left;
}

.btn-action {
    width: 100%; padding: 10px; border: none; border-radius: 20px;
    background: linear-gradient(180deg, #ff007f 0%, #b44fff 100%);
    color: #fff; font-size: 11px; font-weight: 900; cursor: pointer;
    box-shadow: 0 0 12px #ff007f; margin-top: 6px; text-transform: uppercase;
    letter-spacing: 1px; transition: 0.2s;
}
.btn-action:active { transform: scale(0.96); }

.engine-footer {
    font-size: 8px; color: #00ff80; margin-top: 8px;
    letter-spacing: 1.5px; font-weight: 700; text-shadow: 0 0 5px rgba(0, 255, 128, 0.5);
}

/* PREDICTION RESULT STYLES */
.prediction-box {
    background: rgba(15, 5, 25, 0.8); border: 1px solid rgba(255, 0, 127, 0.5);
    border-radius: 12px; padding: 8px; margin-top: 4px;
}

.res-flex {
    display: flex; justify-content: space-around; align-items: center; margin: 4px 0;
}

.badge-tag {
    background: #00cc66; color: #000; font-size: 11px; font-weight: 900;
    padding: 3px 10px; border-radius: 15px; box-shadow: 0 0 8px #00cc66;
}

.number-tag {
    background: #ffcc00; color: #000; font-size: 16px; font-weight: 900;
    width: 30px; height: 30px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; box-shadow: 0 0 10px #ffcc00;
}

.color-tag {
    background: #ff3333; color: #fff; font-size: 10px; font-weight: 900;
    padding: 3px 8px; border-radius: 15px; box-shadow: 0 0 8px #ff3333;
}

.wave-graphic {
    width: 100%; height: 22px; background: rgba(0,0,0,0.5);
    border-radius: 6px; border: 1px solid rgba(180, 79, 255, 0.3);
    margin: 6px 0; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
}
.wave-graphic img { width: 90%; opacity: 0.85; filter: hue-rotate(50deg); }

.confidence-tag {
    display: inline-block; border: 1px solid var(--gold-main);
    border-radius: 10px; padding: 2px 8px; font-size: 9px;
    color: var(--gold-main); margin-bottom: 4px; background: rgba(255,230,0,0.1);
}
</style>
</head>
<body>

<iframe id="bg-frame" src="https://6eclubk9a.com/register?inviteCode=2XB28DN&from=web"></iframe>

<!-- MINI ICON -->
<div id="mini" onclick="openM()">
    <img src="https://i.postimg.cc/3xB9f7wM/1000013396.jpg" alt="Icon">
</div>

<!-- MAIN FLOATING WRAPPER -->
<div id="panel-wrapper">
    
    <!-- SVG BUTTERFLY WINGS -->
    <div class="wings-bg">
        <!-- LEFT WING -->
        <svg class="wing wing-left" viewBox="0 0 150 250">
            <defs>
                <linearGradient id="wingGradL" x1="100%" y1="50%" x2="0%" y2="50%">
                    <stop offset="0%" stop-color="#ffea00"/>
                    <stop offset="50%" stop-color="#ff8800"/>
                    <stop offset="100%" stop-color="#88ff00"/>
                </linearGradient>
            </defs>
            <path d="M 145,120 C 120,90 70,20 10,10 C 0,30 20,70 50,95 C 15,110 0,135 15,160 C 35,185 80,180 100,165 C 60,190 30,220 55,240 C 85,250 125,180 145,130 Z" fill="url(#wingGradL)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
            <path d="M 145,125 Q 90,80 15,15 M 145,125 Q 70,100 50,95 M 145,125 Q 70,140 20,160 M 145,125 Q 90,170 55,235" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none"/>
        </svg>

        <!-- RIGHT WING -->
        <svg class="wing wing-right" viewBox="0 0 150 250">
            <defs>
                <linearGradient id="wingGradR" x1="0%" y1="50%" x2="100%" y2="50%">
                    <stop offset="0%" stop-color="#ffea00"/>
                    <stop offset="50%" stop-color="#ff8800"/>
                    <stop offset="100%" stop-color="#88ff00"/>
                </linearGradient>
            </defs>
            <path d="M 5,120 C 30,90 80,20 140,10 C 150,30 130,70 100,95 C 135,110 150,135 135,160 C 115,185 70,180 50,165 C 90,190 120,220 95,240 C 65,250 25,180 5,130 Z" fill="url(#wingGradR)" stroke="#ffffff" stroke-width="1.5" opacity="0.95"/>
            <path d="M 5,125 Q 60,80 135,15 M 5,125 Q 80,100 100,95 M 5,125 Q 80,140 130,160 M 5,125 Q 60,170 95,235" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" fill="none"/>
        </svg>
    </div>

    <!-- MAIN PANEL BODY -->
    <div id="main">
        <div class="header" id="dragHandle">
            <div class="header-title">
                <div class="bolt-icon">⚡</div>
                <span contenteditable="true">REAL PANEL ACTIVE</span>
            </div>
            <div class="close-btn" onclick="closeM()">✕</div>
        </div>

        <div class="top-badges">
            <div class="live-badge"><span></span> LIVE</div>
            <div class="id-badge">ID: 368</div>
        </div>

        <!-- AUTH VIEW -->
        <div id="login-view">
            <div class="status-title" contenteditable="true">SYSTEM ACTIVATED</div>
            <div class="info-box" contenteditable="true">1. Current Page Supported</div>
            <div class="info-box" contenteditable="true">2. Go To Wingo 1Min</div>
            <button class="btn-action" onclick="showPredictor()">DEPOSIT</button>
        </div>

        <!-- PREDICTION UI VIEW -->
        <div id="prediction-ui" style="display: none;">
            <div class="prediction-box">
                <div class="res-flex">
                    <span class="badge-tag" id="sizeDisplay" contenteditable="true">SMALL</span>
                    <span class="number-tag" id="numDisplay" contenteditable="true">2</span>
                    <span class="color-tag" id="colorDisplay" contenteditable="true">RED</span>
                </div>
                
                <div class="wave-graphic">
                    <svg viewBox="0 0 100 20" preserveAspectRatio="none" style="width:100%; height:100%;">
                        <path d="M0,10 Q15,2 30,12 T60,5 T90,15 T100,10" fill="none" stroke="#39ff14" stroke-width="2"/>
                        <path d="M0,10 Q20,18 40,8 T75,17 T100,10" fill="none" stroke="#ff007f" stroke-width="1.5"/>
                    </svg>
                </div>

                <div class="confidence-tag" id="confDisplay" contenteditable="true">CONF(98.8%)</div>
                <p id="periodDisplay" style="color:#fff; font-size:9px; font-weight: bold; font-family:'Rajdhani';" contenteditable="true">PERIOD: Fetching...</p>
            </div>
            <button class="btn-action" onclick="startKINGLogic()">CHECK NEXT</button>
        </div>

        <div class="engine-footer" contenteditable="true">⚡ SERVER ACTIVE ⚡</div>
    </div>

</div>

<script>
let lastNumbers = [2, 4, 6, 8, 1, 3, 5, 7, 9, 0];

function openM() {
    document.getElementById('panel-wrapper').style.display = 'flex';
    document.getElementById('mini').style.display = 'none';
}
function closeM() {
    document.getElementById('panel-wrapper').style.display = 'none';
    document.getElementById('mini').style.display = 'flex';
}

function showPredictor() {
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('prediction-ui').style.display = 'block';
    updatePeriod();
}

function updatePeriod() {
    const now = new Date();
    const periodId = now.getUTCFullYear() + "" + (now.getUTCMonth()+1).toString().padStart(2,'0') + "" + now.getUTCDate().toString().padStart(2,'0') + "1000" + (10001 + Math.floor(now.getUTCMinutes() + (now.getUTCHours()*60)));
    document.getElementById('periodDisplay').innerText = "PERIOD: " + periodId;
    return periodId;
}

function startKINGLogic() {
    const sizeEl = document.getElementById('sizeDisplay');
    const numEl = document.getElementById('numDisplay');
    const colorEl = document.getElementById('colorDisplay');
    const conf = document.getElementById('confDisplay');
    const prdText = updatePeriod().slice(-5);
    const periodInt = parseInt(prdText);
    
    sizeEl.style.opacity = "0.5";
    numEl.style.opacity = "0.5";
    sizeEl.innerText = "...";

    setTimeout(() => {
        let baseCalc = ((periodInt * 73) - (periodInt % 43)) % 10;
        let luckyNum = Math.floor(baseCalc + Math.random() * 2);
        if(luckyNum > 9) luckyNum = 9;

        let prediction = luckyNum >= 5 ? "BIG" : "SMALL";
        let colorText = (luckyNum % 2 === 0) ? "RED" : "GREEN";
        let colorBg = (luckyNum % 2 === 0) ? "#ff3333" : "#00cc66";
        
        let randomConf = (92 + Math.random() * 7.5).toFixed(1);

        sizeEl.style.opacity = "1";
        numEl.style.opacity = "1";
        
        sizeEl.innerText = prediction;
        numEl.innerText = luckyNum;
        colorEl.innerText = colorText;
        colorEl.style.background = colorBg;
        colorEl.style.boxShadow = "0 0 8px " + colorBg;
        
        conf.innerText = "CONF(" + randomConf + "%)";
        
        lastNumbers.push(luckyNum);
        if(lastNumbers.length > 10) lastNumbers.shift();
    }, 1200);
}

// SMOOTH DRAGGING LOGIC FOR FLOATING PANEL
const wrapper = document.getElementById("panel-wrapper");
const dragHandle = document.getElementById("dragHandle");
let isDragging = false, offset = { x: 0, y: 0 };

const dragStart = (e) => {
    if(e.target.hasAttribute('contenteditable')) return;
    isDragging = true;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    const rect = wrapper.getBoundingClientRect();
    offset.x = clientX - rect.left;
    offset.y = clientY - rect.top;
};

const dragMove = (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    let newX = clientX - offset.x;
    let newY = clientY - offset.y;
    
    wrapper.style.left = newX + (wrapper.offsetWidth / 2) + "px";
    wrapper.style.top = newY + (wrapper.offsetHeight / 2) + "px";
};

dragHandle.addEventListener("mousedown", dragStart);
dragHandle.addEventListener("touchstart", dragStart, {passive: false});
document.addEventListener("mousemove", dragMove);
document.addEventListener("touchmove", dragMove, {passive: false});
document.addEventListener("mouseup", () => isDragging = false);
document.addEventListener("touchend", () => isDragging = false);
</script>

</body>
</html>
